<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17182b">
  <title>Laugh Lab — Random Joke Generator</title>
  <link rel="stylesheet" href="joke.css">
  <script src="joke.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <a class="back-link" href="./">← Back to Q&amp;S</a>

    <section class="joke-card" aria-labelledby="page-title">
      <div class="sparkle" aria-hidden="true">✦</div>
      <p class="eyebrow">A LITTLE BREAK FOR YOUR BRAIN</p>
      <h1 id="page-title">Laugh Lab</h1>
      <p class="intro">Need a laugh? Grab a fresh joke from the internet.</p>

      <div class="joke-box" aria-live="polite" aria-atomic="true">
        <p id="status" class="status">Your next laugh is one click away.</p>
        <p id="jokeText" class="joke-text">Tap the button and let the API do its thing.</p>
        <p id="jokeDelivery" class="joke-delivery" hidden></p>
        <p id="jokeCategory" class="joke-category" hidden></p>
      </div>

      <button id="jokeButton" class="joke-button" type="button">
        <span aria-hidden="true">🎲</span> Tell me a joke
      </button>
      <p class="api-note">Jokes provided by <a href="https://jokeapi.dev/" target="_blank" rel="noreferrer">JokeAPI</a> · Safe mode on</p>
    </section>
  </main>
</body>
</html>
